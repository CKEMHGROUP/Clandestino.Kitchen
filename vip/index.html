<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .bg-container {
            background-image: url('../img/bg5.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100%;
            width: 100%;
            position: relative;
        }

        /* 50% transparent white overlay */
        .overlay {
            background-color: rgba(255, 255, 255, 0.50);
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 75% Transparent circular button */
        .contact-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            /* 50% transparent dark gray text and border */
            color: rgba(51, 51, 51, 0.75);
            border: 2px solid rgba(51, 51, 51, 0.75);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            background-color: transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        /* Hover animation: fills into solid color on hover */
        .contact-btn:hover {
            background-color: rgba(51, 51, 51, 0.9);
            border-color: rgba(51, 51, 51, 0.9);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <div class="overlay">
            <a href="mailto:jc@clandestino.vip?subject=request%20information%20about" class="contact-btn">CONTACT</a>
        </div>
    </div>

</body>
</html>
